manifestVersion: 1
id: depool-node
category: bitcoin
name: Depool Node
version: 0.3.0
tagline: Mine with your own node — no pool in the middle
description: >-
  Mine Bitcoin with your own node and no pool in the middle. This app runs
  the depool box — a Stratum endpoint for your ASIC on LAN port 23333, the bead
  line your shares are recorded on, the block builder that closes a window and
  submits the block, and the box's own page — plus the Lightning wallet your
  payouts land in.


  IT USES YOUR BITCOIN NODE. There is no second copy of the blockchain here:
  the app requires the Bitcoin Node app and reads block templates from it
  (getblocktemplate). A pruned node is fine — mining only needs the tip.


  SET-UP. Install Bitcoin Node first (Umbrel offers to), then open this app.
  Its page shows your node's live status and the exact pool URL to type into
  your ASIC — this device's address on port 23333. Claim the box on the Mine
  page at hashoid.io, then point your miner at it. Your shares are signed by
  this node, and each block pays the address the node declares, straight from
  the coinbase — no pool wallet in between.
