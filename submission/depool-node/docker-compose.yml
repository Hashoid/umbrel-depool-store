# depool-node — the depool stack as a one-click Umbrel app.
#
# v0.2.2 — MAINNET-FIRST (Damon 2026-08-31 spec reframe: "depool is a
# payout-coordination protocol for any SHA-256 Bitcoin, mainnet-first.
# There is no depool chain"). The blake2b fork was the cheap test ground;
# THIS app mines real Bitcoin:
#   (chain)      THE USER'S BITCOIN NODE — the Umbrel Bitcoin Node app, used
#                as a dependency. It is the template source (getblocktemplate)
#                for the ASIC's shares and the Lightning settlement chain. No
#                second copy of the chain is ever downloaded by this app.
#   cln          real-sats Lightning; payouts from the pool prime land on
#                the miner's BOLT12 offer
#   stratum      where the ASIC points (LAN :23333 — 3333 is taken in the
#                official store, the container still listens on 3333)
#                same node — template sovereignty, your node your rules (spec §7.1)
#   sharechaind  the bead DAG + payout commitment, network tag "bitcoin"
#   relay        local archival relay; the pool relay (relay.hashoid.io)
#                carries the live shares
#   control      the node page + the hashoid heartbeat (claim-first pairing)
# No bootstrap one-shot: nothing to fund on mainnet — the user deposits
# real sats through the on-chain card (control /onchain) when they want the
# payout rail loaded. There is no blake2b, no regtest, no fork anywhere in
# this file.
#
# Umbrel deltas (why this file differs from mod-btc/stack/docker-compose.yml):
#   1. images: pinned ghcr.io/hashoid/* (built multi-arch by the repo's
#      release workflow) — Umbrel pulls, it never builds
#   1b. the chain comes from the `bitcoin` dependency app (manifest
#      `dependencies: [bitcoin]`), never from a second bitcoind in here
#   2. volumes: binds under ${APP_DATA_DIR}/data (umbrelOS validates)
#   3. the /modules tree is BAKED into depool-sharechaind (an Umbrel box has
#      no platform checkout)
#   4. box identity: HARDWARE_ID from ${APP_SEED} (deterministic per
#      install) — claim-first pairing works untouched
#   5. control reaches the chain over RPC (the dependency node) and CLN over
#      its own unix socket — never `docker exec` into another app's container,
#      and never the host Docker socket (umbrelOS forbids that mount)
# A regtest overlay for dev/harness lives beside this file
# (docker-compose.regtest.yml) — umbrelOS never sees it.
#
# ⚠ EVERY SERVICE CARRIES nofile=524288 (v0.2.2, 2026-09-13). Docker's default
# soft nofile is 1024, and on this stack one fd is one reader: the rehearsal
# lane's relay hit EMFILE that way (69k 'Too many open files' in 24h), dropped
# readers mid-page, and the truncated bead set that produced is what the money
# side then had to learn to refuse. soft = hard so nothing has to be raised at
# runtime. Applies to the regtest overlay too (it inherits these services).
version: "3.7"

services:
  # the umbrelOS auth proxy — "Open" in the app drawer lands on the control
  # API (the same 127.0.0.1:28700 JSON surface the bare-metal node page uses)
  app_proxy:
    environment:
      APP_HOST: depool-node_control_1
      APP_PORT: "28700"

  # ── THE CHAIN IS THE USER'S OWN BITCOIN NODE (Damon, 2026-09-13) ──
  # No bitcoind service here, deliberately. If the user has the Umbrel Bitcoin
  # Node app we USE THEIRS: `dependencies: [bitcoin]` in the manifest, and
  # umbrelOS exports the contract below (see that app's exports.sh) — node IP,
  # RPC port/user/pass, network, and its data dir for a read-only mount. One
  # node, one chain, one copy of the blocks: no second download, no multi-day
  # sync started silently behind the user's back, and the pruned/full choice
  # stays the user's (a pruned node mines fine — getblocktemplate does not need
  # old blocks, and CLN only needs RPC).
  #
  #   APP_BITCOIN_NODE_IP        the node's IP on the Umbrel app network
  #   APP_BITCOIN_RPC_PORT       its RPC port (8332)
  #   APP_BITCOIN_RPC_USER/PASS  the credentials it generated for consumers
  #   APP_BITCOIN_DATA_DIR       its datadir on the host (mount read-only)
  #   APP_BITCOIN_NETWORK        mainnet | testnet | signet | regtest
  #
  # When the node is NOT there: on Umbrel the dependency prompt IS the ask
  # (umbrelOS refuses the install until Bitcoin Node is installed — the user
  # answers it before anything syncs). On the plain Linux path (stack/install.sh)
  # the installer asks outright: use an existing node, or we place a PRUNED
  # chain seeded from ours and the box CONTINUES from it. A from-zero download
  # is never acceptable. hashOS appliances ship the seed baked.

  # ── Lightning (real sats): the miner's payout rail ──
  # cln-payer and cln-payee as on the stack; on mainnet no --developer, and
  # bitcoin-retry-timeout covers the days-long chain sync. The bitcoin-cli
  # wrapper inside the image targets the bitcoin app's node via env (BCLI_*), so the
  # same image also serves the regtest dev overlay.
  cln-payer:
    image: ghcr.io/hashoid/depool-cln:v0.2.9@sha256:04f8eb3f8487a08f30088364778c05909c81c5ec5f08ce39ad7038ff02329fcb
    command: >
      --network=${CLN_NET:-bitcoin} --lightning-dir=/root/.lightning-payer
      --bitcoin-datadir=/home/bitcoin/.bitcoin
      --bitcoin-cli=/usr/local/bin/bitcoin-cli
      --bitcoin-rpcuser=${APP_BITCOIN_RPC_USER} --bitcoin-rpcpassword=${APP_BITCOIN_RPC_PASS}
      --bitcoin-rpcconnect=${APP_BITCOIN_NODE_IP} --bitcoin-rpcport=${APP_BITCOIN_RPC_PORT}
      --bitcoin-retry-timeout=3600
      --addr=0.0.0.0:9735 --disable-plugin=cln-grpc --log-level=info
    environment:
      BCLI_CONNECT: ${APP_BITCOIN_NODE_IP}
      BCLI_PORT: "${APP_BITCOIN_RPC_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data/cln-payer:/root/.lightning-payer
      - ${APP_BITCOIN_DATA_DIR}:/home/bitcoin/.bitcoin:ro
    depends_on: []
    restart: on-failure
    ulimits:
      nofile:
        soft: 524288
        hard: 524288

  cln-payee:
    image: ghcr.io/hashoid/depool-cln:v0.2.9@sha256:04f8eb3f8487a08f30088364778c05909c81c5ec5f08ce39ad7038ff02329fcb
    command: >
      --network=${CLN_NET:-bitcoin} --lightning-dir=/root/.lightning-payee
      --bitcoin-datadir=/home/bitcoin/.bitcoin
      --bitcoin-cli=/usr/local/bin/bitcoin-cli
      --bitcoin-rpcuser=${APP_BITCOIN_RPC_USER} --bitcoin-rpcpassword=${APP_BITCOIN_RPC_PASS}
      --bitcoin-rpcconnect=${APP_BITCOIN_NODE_IP} --bitcoin-rpcport=${APP_BITCOIN_RPC_PORT}
      --bitcoin-retry-timeout=3600
      --addr=0.0.0.0:9735 --disable-plugin=cln-grpc --log-level=info
    environment:
      BCLI_CONNECT: ${APP_BITCOIN_NODE_IP}
      BCLI_PORT: "${APP_BITCOIN_RPC_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data/cln-payee:/root/.lightning-payee
      - ${APP_BITCOIN_DATA_DIR}:/home/bitcoin/.bitcoin:ro
    depends_on: []
    restart: on-failure
    ulimits:
      nofile:
        soft: 524288
        hard: 524288

  # local archival relay (loopback only — live shares ride the pool relay)
  relay:
    image: ghcr.io/hashoid/depool-relay:v0.2.9@sha256:8abcd5dc65c36ebbda0ddda7aed34ff3898af2ac374c28e87db2aed47c3e0bf3
    volumes:
      - ${APP_DATA_DIR}/data/relay:/var/lib/strfry
    # no host publish: same-app traffic uses the compose network (Docker DNS),
    # and an App Store package should not claim a host port it does not need
    restart: on-failure
    ulimits:
      nofile:
        soft: 524288
        hard: 524288

  # ── the sharechain daemon — the bead DAG + payout commitment ──
  sharechaind:
    image: ghcr.io/hashoid/depool-sharechaind:v0.2.9@sha256:6b9f5832408d2a5dea7b48b4cd0a85b11ae8b5a132330b68b9dfb8209225d3dc
    cpus: 0.5
    environment:
      # the tenant bundle's values with the MAINNET network tag (spec: the
      # network names the chain being mined; default "bitcoin")
      RELAYS: wss://relay.hashoid.io/ws/
      NETWORK: bitcoin
      DEPOOL_MODE: smooth
      DEPOOL_POWER: low
      # node role — the user's ASIC does the hashing, through stratum below
      DEPOOL_GRIND: "0"
      LOTTERY_BITS: "26"
      LOTTERY_TARGET: "1"
      POW_BITS: "21"
      BEADS_TARGET: "6"
      BLOCK_EVERY: "3"
      CHAIN_RPC: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}
      CHAIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      CHAIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      CHAIN_KIND: sha256d
      BLOCK_TRIES: "500000"
      REWARD_SATS: "30000"
      CLN_RPC: /run/cln/${CLN_NET:-bitcoin}/lightning-rpc
      CLN_PAYEE_RPC: /run/cln-payee/${CLN_NET:-bitcoin}/lightning-rpc
      # ⚠ THE BUILDER ROLE IS ON (uniMaster ruling 2026-09-13): a lined daemon
      # that is not the builder mints beads and NEVER closes a window — no
      # block, no payout, ever. On this box the daemon IS the miner's own
      # builder (template sovereignty, §7.1) and it is the only lined daemon
      # here, so the one-builder-per-line law holds.
      LINE_BUILD: "1"
      # ⚠ AND THE BEAD MUST NAME AN ADDRESS (same ruling): the daemon refuses to
      # boot without one and no compose can know it — it is minted at runtime
      # from the box's own CLN wallet. The control sidecar mints it and writes
      # it to the shared data dir (/data/self-payout-addr, which every box has);
      # this line is the OVERRIDE for a user who wants a specific address.
      SELF_PAYOUT_ADDR: ${SELF_PAYOUT_ADDR:-}
    volumes:
      - ${APP_DATA_DIR}/data/miner:/data
      - ${APP_DATA_DIR}/data/cln-payer:/run/cln
      - ${APP_DATA_DIR}/data/cln-payee:/run/cln-payee
    depends_on:
      relay:
        condition: service_started
      cln-payer:
        condition: service_started
      cln-payee:
        condition: service_started
    restart: on-failure
    ulimits:
      nofile:
        soft: 524288
        hard: 524288

  control:
    image: ghcr.io/hashoid/depool-control:v0.2.9@sha256:f17b33af51a5b6e1a5fa1df727f8a3a1dfde91bd3f066d86f7aaddd48b54bb5d
    environment:
      ORIGIN: https://hashoid.io
      # deterministic per-install (umbrelOS derives it from the store seed) —
      # the box shows up unclaimed on the hashoid Mine page, the user names it
      HARDWARE_ID: hw-umbrel-${APP_SEED}
      NODE_HOST: ${DEVICE_HOSTNAME:-umbrel}
      DEPOOL_POWER: low
      NETWORK: bitcoin
      # the rails, retargeted at the USER'S node (control.js talks JSON-RPC to
      # it directly — no docker exec into another app's container, and no host
      # Docker socket, which umbrelOS forbids mounting)
      CHAIN_RPC_URL: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}
      CHAIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      CHAIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      # from the app's own exports.sh, which maps the NODE's network
      # (APP_BITCOIN_NETWORK) into CLN's vocabulary
      CLN_NET: ${CLN_NET:-bitcoin}
      CLN_PAYER_DIR: /run/cln
      # the ASIC-facing host port (the app page prints it; the container's own
      # listener stays 3333)
      STRATUM_PORT: "23333"
      CLN_PAYEE_DIR: /run/cln-payee
      # umbrelOS runs every app under --project-name <app id>; control keeps
      # the project name so the pages it serves can name the box's own
      # containers (start/stop on our own Linux stacks — never for liveness,
      # which reads each service directly and never touches docker)
      COMPOSE_PROJECT_NAME: depool-node
      COMPOSE_DIR: /depool
      AUTOPAY_SERVICE_FEE: ""
      SERVICE_FEE_CAP_PPM: "3000"
      BILL_MS: "3600000"
    volumes:
      # ⚠ THE HOST DOCKER SOCKET IS DELIBERATELY NOT MOUNTED (umbrelOS: "host
      # Docker socket access is effectively host-root access"). The app does not
      # need it: the chain is the dependency node over RPC, and CLN is reached
      # through its own unix socket below.
      # /depool holds the SAME compose file (baked into the image at release
      # time) for the wallet's compose reference, never used to up/down.
      - ${APP_DATA_DIR}/data/miner:/data
      - ${APP_DATA_DIR}/data/cln-payer:/run/cln
      - ${APP_DATA_DIR}/data/cln-payee:/run/cln-payee
    depends_on:
      - sharechaind
    restart: on-failure
    ulimits:
      nofile:
        soft: 524288
        hard: 524288

  # ── stratum — where the user's ASIC points (LAN-exposed on 23333) ──
  # Jobs come from THIS box's bitcoind via getblocktemplate: the user mines
  # their own templates (spec §7.1 template sovereignty), shares join the
  # sharechain, blocks submit straight back to the network.
  stratum:
    image: ghcr.io/hashoid/depool-stratum:v0.2.9@sha256:b933b0716a42431016f12206fd74b579b239413501d2ab19a3d490091cad54c1
    environment:
      STRATUM_PORT: "3333"
      CHAIN_RPC: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}
      CHAIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      CHAIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      SHARE_DIFF: "1"
    ports:
      - "0.0.0.0:23333:3333"
    volumes:
      - ${APP_DATA_DIR}/data/miner:/data
    depends_on: []
    restart: on-failure
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
