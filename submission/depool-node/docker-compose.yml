# depool-node — the depool stack as a one-click Umbrel app. v0.3.0.
#
# ⚠ TWO CONTAINERS, THE THREE-PIECE PRODUCT (Damon's ruling, 2026-09-20): the
# depool box IS one program — the rig door (stratum), the bead line, the block
# builder, the status page and the claim/hello wire are listeners in ONE
# process, modules/mod-depool/box/box.js. v0.2.x shipped the OLD shape as six
# containers (stratum + sharechaind + control + relay + cln-payer + cln-payee);
# three of those images could no longer be built from any existing source
# (stack/stratum, stack/sharechaind, stack/control all died in the 2026-09-18
# whittle) and the app's ASIC port was published by the dead one. v0.3.0 is
# what the plain-Linux box bundle runs: a chain, a box, a wallet.
#
#   (chain)  THE USER'S BITCOIN NODE — the Umbrel Bitcoin Node app, used as a
#            dependency. It is the template source (getblocktemplate) for the
#            ASIC's shares and the Lightning settlement chain. No second copy of
#            the chain is ever downloaded by this app.
#   box      depool-box: the box program with the modules tree baked (an Umbrel
#            has no platform checkout). Serves the ASIC on 23333, serves the
#            page on 28700 (the umbrelOS Open button), heartbeats the tenant AND
#            says hello at enrol — the wire that makes a store box claimable.
#   cln      the miner's wallet: the payout address is minted from it at boot
#            (listfunds → newaddr) and a BOLT12 offer is published from it, so
#            the provider can pay this box over Lightning.
#
# Umbrel deltas (why this file differs from mod-btc/stack/docker-compose.yml):
#   1. images: pinned ghcr.io/hashoid/* (multi-arch, digest-pinned) — Umbrel
#      pulls, it never builds
#   1b. the chain comes from the `bitcoin` dependency app (manifest
#      `dependencies: [bitcoin]`), never from a second bitcoind in here
#   2. volumes: binds under ${APP_DATA_DIR}/data (umbrelOS validates)
#   3. the /modules tree is BAKED into depool-box
#   4. box identity: HARDWARE_ID from ${APP_SEED} (deterministic per install) —
#      claim-first pairing works untouched
#   5. the box reaches the chain over RPC (the dependency node) and CLN over its
#      own unix socket — never `docker exec` into another app's container, and
#      never the host Docker socket (umbrelOS forbids that mount)
# A regtest overlay for dev/harness lives beside this file
# (docker-compose.regtest.yml) — umbrelOS never sees it.
#
# ⚠ EVERY SERVICE CARRIES nofile=524288 (v0.2.2, 2026-09-13). Docker's default
# soft nofile is 1024, and on this stack one fd is one reader: the rehearsal
# lane's relay hit EMFILE that way (69k 'Too many open files' in 24h), dropped
# readers mid-page, and the truncated bead set that produced is what the money
# side then had to learn to refuse. soft = hard so nothing has to be raised at
# runtime. Applies to the regtest overlay too (it inherits these services).
version: "3.7"

services:
  # the umbrelOS auth proxy — "Open" in the app drawer lands on the box's own
  # status page (the same 127.0.0.1:28700 surface the bare-metal node page uses)
  app_proxy:
    environment:
      APP_HOST: depool-node_box_1
      APP_PORT: "28700"

  # ── Lightning (real sats): the miner's payout rail ──
  # CLN on the user's own node; on mainnet no --developer, and
  # bitcoin-retry-timeout covers the days-long chain sync. The bitcoin-cli
  # wrapper inside the image targets the bitcoin app's node via env (BCLI_*), so
  # the same image also serves the regtest dev overlay. ⚠ ONE node, not the
  # payer/payee pair v0.2.x ran: the payer was the provider's side (it belongs
  # to the provider, not to a miner's box) and the payee had no consumer left
  # once the box program held the whole line.
  cln:
    image: ghcr.io/hashoid/depool-cln:v0.3.0@sha256:9e6d6c2c08b07171d27c4929c909878a720be301af0146f2e4dbfb86bf30a4c9
    command: >
      --network=${CLN_NET:-bitcoin} --lightning-dir=/root/.lightning
      --bitcoin-datadir=/home/bitcoin/.bitcoin
      --bitcoin-cli=/usr/local/bin/bitcoin-cli
      --bitcoin-rpcuser=${APP_BITCOIN_RPC_USER} --bitcoin-rpcpassword=${APP_BITCOIN_RPC_PASS}
      --bitcoin-rpcconnect=${APP_BITCOIN_NODE_IP} --bitcoin-rpcport=${APP_BITCOIN_RPC_PORT}
      --bitcoin-retry-timeout=3600
      --addr=0.0.0.0:9735 --disable-plugin=cln-grpc --log-level=info
    environment:
      BCLI_CONNECT: ${APP_BITCOIN_NODE_IP}
      BCLI_PORT: "${APP_BITCOIN_RPC_PORT}"
    volumes:
      - ${APP_DATA_DIR}/data/cln:/root/.lightning
      - ${APP_BITCOIN_DATA_DIR}:/home/bitcoin/.bitcoin:ro
    depends_on: []
    restart: on-failure
    ulimits:
      nofile:
        soft: 524288
        hard: 524288

  # ── THE BOX: one program, three listeners ─────────────────────────────────
  # The rig door (the ASIC points at LAN:23333), the bead line and the page are
  # IN-PROCESS. It builds jobs from THIS box's node via getblocktemplate
  # (template sovereignty, spec §7.1), mints beads for the shares it admits,
  # closes windows and submits blocks straight back to the network.
  box:
    image: ghcr.io/hashoid/depool-box:v0.3.0@sha256:181aafd0f06c282a01072a6c0ef8f130b63a143f4eb7021323eff62e26e86657
    environment:
      # the pool relay carries the live line; a home box has no second node
      RELAYS: wss://relay.hashoid.io/ws/
      NETWORK: bitcoin
      # the MINING net (the journal's `net`) and the chain kind the PoW follows
      MINING_NET: sha256d
      CHAIN_KIND: sha256d
      EVENT_CHAIN: bitcoin
      CHAIN_RPC: http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}
      CHAIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      CHAIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      DATA_DIR: /data
      # CLN's socket lives at <lightning-dir>/<network>/lightning-rpc; the box
      # mints its own payout address from this wallet (listfunds → newaddr
      # bech32) and adopts it live — a key that never leaves this box.
      CLN_WALLET_DIR: /root/.lightning
      CLN_NET: ${CLN_NET:-bitcoin}
      # the ASIC-facing listener (the host side is 23333 below: 3333 is taken in
      # the official store's host-port space) and the in-process door for any
      # other rig that can reach the box
      STRATUM_PORT: "3333"
      INTAKE_PORT: "28918"
      # the page umbrelOS opens: 0.0.0.0, because the proxy is another container
      STATUS_PORT: "28700"
      STATUS_HOST: 0.0.0.0
      # the claim wire: the box registers at enrol (POST /api/btc/rigs/hello)
      # with this identity and its wallet's payout address, so it shows up
      # UNCLAIMED on hashoid.io → Mine and the user names it there.
      ORIGIN: https://hashoid.io
      HARDWARE_ID: hw-umbrel-${APP_SEED}
      # the box's own payout address: minted from the wallet above; this is the
      # operator's override for a miner who wants a specific address paid
      SELF_PAYOUT_ADDR: ${SELF_PAYOUT_ADDR:-}
      # ⚠ EVERY COINBASE THIS BOX SERVES PAYS THE PROVIDER (Damon's GO,
      # 2026-09-16). Unset = this box IS its own provider and pays itself (a
      # self-hosted pool). The provider's signed notice moves it once the lane's
      # key below is configured.
      PROVIDER_ADDR: ${PROVIDER_ADDR:-}
      # the trust anchor: whose signed kind-7104 notice this box follows. Empty
      # = it follows no notice and mines at BEAD_DIFFICULTY below.
      DIFFICULTY_PUB: ${DIFFICULTY_PUB:-}
      BEAD_DIFFICULTY: ${BEAD_DIFFICULTY:-19}
      # the visible fee line the provider takes, if any (0 bps = none)
      FEE_ADDR: ${FEE_ADDR:-}
      FEE_BPS: ${FEE_BPS:-100}
    volumes:
      - ${APP_DATA_DIR}/data/miner:/data
      - ${APP_DATA_DIR}/data/cln:/root/.lightning
    ports:
      # ⚠ 3333 IS TAKEN in the official store's host-port space
      # (bleskomat-server), so the HOST side moves; the container keeps its own
      # listener.
      - "0.0.0.0:23333:3333"
    depends_on:
      cln:
        condition: service_started
    restart: on-failure
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
