# release.yml — push the depool images for the app store to ghcr.io,
# MULTI-ARCH (linux/amd64 + linux/arm64 — most Umbrels are Raspberry Pis).
# Manual: Actions → release → Run workflow (input: version, e.g. v0.3.0).
#
# Why CI and not the dev box: the dev box's fine-grained PAT cannot write
# packages; this workflow's GITHUB_TOKEN gets packages:write for free.
# Every input is a PUBLIC artifact the tenant already serves (the bundle
# install.sh uses) — no platform checkout, no secrets, and since v0.2.0 no
# images.tar.gz either: everything builds FROM SOURCE under buildx, so both
# architectures come from the same Dockerfiles.
#
# Image set (v0.3.0, the two-container shape — the app's compose is the contract):
#   depool-box          the box program with the modules tree baked (base:
#                       ghcr.io/hashoid/depool-lined, the canon image)
#   depool-cln          CLN + env-driven bitcoin-cli wrapper (multi-arch bases)
#   depool-relay        strfry 1.1.1 source build (arm64 under qemu) — used by
#                       the regtest dev OVERLAY only; the app publishes to the
#                       pool relay
# ⚠ THE v0.2.x SET IS GONE WITH ITS SOURCES (2026-09-20): depool-stratum built
# from bundle/modules/mod-depool/stack/stratum/Dockerfile, a path the 2026-09-18
# whittle deleted; depool-sharechaind and depool-control built from
# stack/sharechaind and stack/control, both gone. The box program absorbed all
# three. A release that still named them failed at the first bx call.
# The chain node itself is upstream bitcoin/bitcoin:29 — multi-arch already,
# referenced directly by the app compose (the dependency app's node), nothing
# for us to build.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'image version tag, e.g. v0.3.0'
        required: true
permissions:
  contents: write
  packages: write
jobs:
  push:
    runs-on: ubuntu-latest
    env:
      VER: ${{ inputs.version }}
      GH: ghcr.io/hashoid
      ORIGIN: https://hashoid.io
      IMAGES: depool-box depool-cln depool-relay
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3        # arm64 emulation for the source builds
      - uses: docker/setup-buildx-action@v3

      # ── the reduced modules tree + stack sources, from the same bundle ──
      - name: Fetch the tenant bundle
        run: |
          curl -fsSL "$ORIGIN/api/btc/stack/bundle" -o bundle.tgz
          mkdir bundle && tar -xzf bundle.tgz -C bundle stack modules
          cp depool-node/docker-compose.yml bundle/docker-compose.yml
          cp depool-node/docker-compose.regtest.yml bundle/docker-compose.regtest.yml
          ls bundle/modules/mod-depool/box bundle/modules/mod-btc/lib bundle/modules/mod-chat/lib
          # strfry's source build pins -j2; under qemu any parallelism helps
          sed -i 's/make -j2/make -j$(nproc)/' bundle/stack/relay/Dockerfile

      - name: Login to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # ── build both architectures FROM SOURCE, push as one manifest list ──
      - name: Build + push the three images (amd64 + arm64)
        run: |
          set -e
          bx() { docker buildx build --platform linux/amd64,linux/arm64 --push "$@"; }
          # ⚠ THE BOX IS THE CANON IMAGE PLUS A TREE, not a second program: the
          # base is mod-depool's own published box image, so the rig door, the
          # line, the page and the hello wire are the bytes every install runs.
          bx -f release/Dockerfile.box-umbrel        -t $GH/depool-box:$VER        bundle
          bx -f release/Dockerfile.cln-umbrel        -t $GH/depool-cln:$VER        bundle
          bx -f bundle/stack/relay/Dockerfile        -t $GH/depool-relay:$VER      bundle/stack/relay

      # ── the version pins in the app compose must match what we just pushed ──
      - name: Pin the compose + lock
        run: |
          set -e
          node -e '
            const fs = require("fs"), { execSync } = require("child_process");
            const names = process.env.IMAGES.split(" ");
            const ver = process.env.VER, gh = process.env.GH;
            const lock = {};
            for (const n of names) {
              // the MANIFEST LIST digest — what an arm64 pull resolves through
              const d = execSync(`docker buildx imagetools inspect ${gh}/${n}:${ver}`)
                .toString().match(/Digest:\s*(sha256:[0-9a-f]+)/)[1];
              lock[n] = { tag: ver, digest: d };
            }
            fs.writeFileSync("release/images-lock.json", JSON.stringify(lock, null, 1) + "\n");
            // ⚠ TAG **AND** DIGEST, TOGETHER (2026-09-13): the sed this replaces
            // rewrote only the tag and left the digest the line already carried,
            // so a release pinned the NEW tag to the PREVIOUS image — and the
            // app compose is digest-pinned precisely so that cannot happen.
            // Both files: the app compose and the regtest overlay (its chain and
            // its relay are pinned there too).
            for (const f of ["depool-node/docker-compose.yml", "depool-node/docker-compose.regtest.yml"]) {
              let yml = fs.readFileSync(f, "utf8");
              for (const n of names) {
                const re = new RegExp("ghcr\\.io/[a-z0-9-]+/" + n + ":v[0-9.]+(?:@sha256:[0-9a-f]{64})?", "g");
                yml = yml.replace(re, `${gh}/${n}:${ver}@${lock[n].digest}`);
              }
              fs.writeFileSync(f, yml);
            }
          '
          git config user.name "depublish-bot"
          git config user.email "actions@users.noreply.github.com"
          git add depool-node/docker-compose.yml depool-node/docker-compose.regtest.yml release/images-lock.json
          git commit -m "[release] $VER images pushed + pinned (amd64+arm64)" || echo "nothing to commit"
          git push

      - name: Summary
        run: |
          for img in $IMAGES; do
            echo "$GH/$img:$VER pushed (linux/amd64 + linux/arm64)" >> $GITHUB_STEP_SUMMARY
          done
          echo "arm64 strfry builds under qemu — this step is the slow one" >> $GITHUB_STEP_SUMMARY
