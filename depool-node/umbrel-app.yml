manifestVersion: 1
id: depool-node
category: bitcoin
name: Depool Node
version: 0.3.0
tagline: Mine with your own node — no pool in the middle
description: >-
  Mine Bitcoin with your own node, no pool in the middle. This app runs the
  depool box — a Stratum endpoint for your ASIC (LAN port 23333), the bead line
  the shares are recorded on, the block builder that closes a window and submits
  the block, and the box's own status page — plus the Lightning wallet your
  payouts land in.


  IT USES YOUR BITCOIN NODE. This app has no chain of its own: it requires
  the Bitcoin Node app and reads templates from it (getblocktemplate), so
  there is no second copy of the blockchain and nothing to sync twice. If
  your node is pruned that is fine — mining only needs the tip.


  SET-UP: install Bitcoin Node first (Umbrel asks you to), then open this app.
  Its page shows your node's live status and the exact pool URL to type into
  your ASIC — this box's LAN address on port 23333 (3333 belongs to another
  app in the store's host-port space, so the app uses 23333). Claim the box on
  the Mine page at hashoid.io. Your shares are signed by this node; payouts
  settle over Lightning to your own wallet.
releaseNotes: >-
  THE BOX IS ONE PROGRAM NOW. Two containers, the same three pieces as every
  depool install: your Bitcoin node (the dependency), the box, and its wallet.
  The old stratum, sharechain, control and relay containers are gone —
  their jobs are listeners inside the box program, so an install is smaller and
  there is no way for two containers to disagree about one revision of the code.
  This release also carries the CLAIM WIRE: the box registers at enrol, so it
  appears unclaimed on hashoid.io → Mine and you name it there (before this,
  a store box could only heartbeat). And it fixes the box image itself: the
  previous one booted a path the code no longer has. Multi-arch (arm64
  included).
