manifestVersion: 1
id: depool-node
category: bitcoin
name: Depool Node
version: 0.2.5
tagline: Mine with your own node — no pool in the middle
description: >-
  Mine Bitcoin with your own node, no pool in the middle. This app runs a
  Stratum endpoint for your ASIC, the depool sharechain daemon, a local
  share relay, and the Lightning wallet your payouts land in.


  IT USES YOUR BITCOIN NODE. This app has no chain of its own: it requires
  the Bitcoin Node app and reads templates from it (getblocktemplate), so
  there is no second copy of the blockchain and nothing to sync twice. If
  your node is pruned that is fine — mining only needs the tip.


  SET-UP: install Bitcoin Node first (Umbrel asks you to), then open this app.
  Its page shows your node's live status and the exact pool URL to type into
  your ASIC — this box's LAN address on port 23333 (3333 belongs to another
  app in the store's host-port space, so the app uses 23333). Claim the box on
  the Mine page at hashoid.io. Your shares are signed by this node; payouts
  settle over Lightning to your own wallet.
releaseNotes: >-
  The app now follows YOUR node's network instead of assuming mainnet: against
  a regtest or testnet node the Lightning node used to refuse to start, which
  cascaded into the daemon having no payout address. (Store-side fix — the
  images are unchanged.) The app opens to its own page: your node's live status (chain, peers, sync)
  and the exact pool URL for your ASIC, with the claim link. It also now
  builds windows and submits real blocks on YOUR node — the block builder had
  only ever spoken the fork chain's header format, so every block a stock
  Bitcoin node was sent came back refused. Multi-arch (arm64 included).
dependencies:
  - bitcoin
